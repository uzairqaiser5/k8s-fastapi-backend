apiVersion: apps/v1
kind: Deployment
metadata:
  name: fastapi-backend
  namespace: three-tier-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fastapi-backend
  template:
    metadata:
      labels:
        app: fastapi-backend
    spec:
      containers:
        - name: backend
          image: DOCKER_IMAGE_PLACEHOLDER
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: DB_HOST
              value: "postgres-service"
            - name: DB_NAME
              value: "appdb"
            - name: DB_USER
              value: "dbuser"
            - name: DB_PASSWORD
              value: "securepassword123"
---
apiVersion: v1
kind: Service
metadata:
  name: fastapi-service
  namespace: three-tier-app
spec:
  type: NodePort
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30008
  selector:
    app: fastapi-backend